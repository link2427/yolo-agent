x-yolo-agent: &yolo-agent
  image: ${YOLO_IMAGE:-yolo-agent:1.2.0}
  user: "10001:10001"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
    - seccomp=./config/seccomp-yolo.json
  env_file:
    - path: ./config/yolo.env
      required: false
  working_dir: /workspace
  volumes:
    - ${YOLO_WORKSPACE:-.}:/workspace
    - yolo-agent-home:/home/agent
  tmpfs:
    - /tmp:rw,nosuid,size=2g
    - /run:rw,noexec,nosuid,size=64m
    - /dev/shm:rw,noexec,nosuid,size=256m
  mem_limit: ${YOLO_MEM:-8g}
  cpus: ${YOLO_CPUS:-4}
  pids_limit: 2048
  stop_grace_period: 30s

# The image is a single always-on browser runtime. Every web surface is
# exposed on the internal network by default (this build is meant for an
# air-gapped LAN with no external reach).
services:
  agent:
    <<: *yolo-agent
    stdin_open: true
    tty: true
    command: /bin/bash -l

  server:
    <<: *yolo-agent
    restart: unless-stopped
    command: /opt/yolo/server-start.sh
    ports:
      - ${YOLO_BIND_ADDRESS:-0.0.0.0}:${YOLO_CODE_PORT:-8080}:8080
      - ${YOLO_BIND_ADDRESS:-0.0.0.0}:${YOLO_TERMINAL_PORT:-7681}:7681
      - ${YOLO_BIND_ADDRESS:-0.0.0.0}:${YOLO_OPENHANDS_PORT:-3000}:3000

  deepseek:
    <<: *yolo-agent
    restart: unless-stopped
    command: /opt/yolo/deepseek-web-start.sh
    ports:
      - ${YOLO_BIND_ADDRESS:-0.0.0.0}:${DSH_WEB_PORT:-3080}:3081

volumes:
  yolo-agent-home:
    name: ${YOLO_HOME_VOLUME:-yolo-agent-home-v1}
