name: container-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: container-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate shell scripts
        run: |
          find bin docker -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          find bin docker -type f -name '*.sh' -print0 | xargs -0 shellcheck
      - name: Validate Bake graph
        run: docker buildx bake --print >/dev/null

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build and smoke-test both profiles
        run: |
          docker buildx bake \
            --set '*.cache-from=type=gha,scope=container-ci' \
            --set '*.cache-to=type=gha,mode=max,scope=container-ci'
