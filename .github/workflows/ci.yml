name: container-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: container-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shell scripts
        run: |
          mapfile -t files < <( { find docker scripts -type f -name '*.sh'; \
            grep -rlE '^#!/usr/bin/env bash' docker/rootfs/opt/yolo/bin; } | sort -u)
          for f in "${files[@]}"; do bash -n "$f"; done
          shellcheck -S warning "${files[@]}"

      - name: Python
        run: |
          python3 -m py_compile docker/rootfs/opt/yolo/lib/*.py docker/rootfs/opt/yolo/lab/*.py \
            docker/tests/*.py tools/*.py

      - name: JSON
        run: |
          for f in config/seccomp.json docker/rootfs/opt/yolo/vscode/settings.json docker/skills/packs.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done

      - name: Bake graph
        run: docker buildx bake --print >/dev/null

      - name: Compose files
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.lab.yaml config --quiet

  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tier: [core, cpp, full]
    name: build ${{ matrix.tier }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # The smoke suites are the gate. They run with no network and check every
      # agent end to end against a stub model server, every web service, the
      # lab gateway, and (cpp/full) real ELF and PE builds and the RE tools.
      - name: Build and smoke-test ${{ matrix.tier }}
        run: |
          docker buildx bake \
            --set '${{ matrix.tier }}-test.cache-from=type=gha,scope=ci-${{ matrix.tier }}' \
            --set '${{ matrix.tier }}-test.cache-to=type=gha,mode=max,scope=ci-${{ matrix.tier }}' \
            '${{ matrix.tier }}-test'
