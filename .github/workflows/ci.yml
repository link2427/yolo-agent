name: container-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: container-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate shell scripts
        run: |
          find bin docker scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          find bin docker scripts -type f -name '*.sh' -print0 | xargs -0 shellcheck

      - name: Validate JSON config and seccomp profiles
        run: |
          for f in config/*.json docker/rootfs/home/agent/.config/opencode/opencode.json \
                   docker/rootfs/home/agent/.pi/agent/settings.json \
                   docker/rootfs/home/agent/.local/share/code-server/User/settings.json \
                   docker/deepseek-harness/package.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done

      - name: Validate the bake graph
        run: docker buildx bake --print >/dev/null

      - name: Validate the compose files
        run: |
          for f in compose.yaml compose.cpp.yaml compose.reverse.yaml; do
            docker compose -f "$f" config --quiet
          done

  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base
            dockerfile: Dockerfile
          - name: cpp
            dockerfile: Dockerfile.cpp
          - name: reverse
            dockerfile: Dockerfile.reverse
    name: build ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # The image smoke suites (target `test`) are the real gate: they compile
      # a Windows PE and a Linux ELF, extract a PyInstaller archive, and serve
      # HTTP from code-server/ttyd/DeepSeek Harness.
      - name: Build and smoke-test ${{ matrix.name }}
        run: |
          docker buildx bake \
            --set '${{ matrix.name }}-test.cache-from=type=gha,scope=ci-${{ matrix.name }}' \
            --set '${{ matrix.name }}-test.cache-to=type=gha,mode=max,scope=ci-${{ matrix.name }}' \
            '${{ matrix.name }}-test'
