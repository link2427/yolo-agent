name: container-release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: container-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version
        id: v
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$v" == "$(cat VERSION)" ]] || { echo "tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/yolo-agent" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h /

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tests run first; nothing is published unless every tier passes.
      - name: Smoke-test all tiers
        run: |
          docker buildx bake \
            --set '*.cache-from=type=gha,scope=release' \
            --set '*.cache-to=type=gha,mode=max,scope=release' \
            tests

      - name: Build and push all tiers
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          VERSION: ${{ steps.v.outputs.version }}
          VCS_REF: ${{ github.sha }}
        run: |
          export REGISTRY="${REGISTRY,,}"
          docker buildx bake \
            --set '*.cache-from=type=gha,scope=release' \
            --set '*.output=type=registry' \
            images

      - name: Free BuildKit cache before export
        run: docker buildx prune --all --force && df -h /

      - name: Package the offline release
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends zstd zip >/dev/null
          ./scripts/package-offline.sh "${{ steps.v.outputs.version }}" "${{ steps.v.outputs.prefix }}" -- dist
          df -h /

      - name: Publish the GitHub release
        run: |
          v="${{ steps.v.outputs.version }}"
          notes="$(awk -v v="$v" '$0 ~ "^## " v {p=1; next} /^## / && p {exit} p' CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest \
            --title "yolo-agent $v" --notes "$notes" dist/* \
            || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
